# Fleet definition: the input to every Refresh.
#
# `rules` say which Machines are in the fleet. `machines` is the expanded list
# the agent maintains during a Refresh (it adds new variants found on the spec
# pages and assigns each one a Hardware tier using `tier_rules`).
#
# Edit `rules` by hand when the fleet changes. Let the Refresh maintain `machines`.

rules:
  - id: macbook-pro-apple-silicon
    description: Every MacBook Pro with an Apple M-series chip (M1 onward, all Pro/Max variants), every memory option Apple sold.
    source: https://support.apple.com/en-us/docs/mac
    auto_add_new: true          # new MacBook Pro chips/memory options join the fleet automatically
  - id: dell-latitude-7350
    description: Dell Latitude 7350 (2024, Core Ultra), 16 GB RAM.
    product_codes: [latitude-13-7350-2-in-1-laptop]
    auto_add_new: false         # a new generation is listed as "new, confirm in fleet"
  - id: dell-pro-14-premium
    description: Dell Pro 14 Premium, 32 GB RAM, both generations.
    product_codes: [dell-pro-pa14250-laptop, dell-pro-pa14260-laptop]
    next_generation_probe: dell-pro-pa14270-laptop
    auto_add_new: false
  - id: dell-pro-max-16
    description: Dell Pro Max 16, 32 GB RAM, every discrete GPU option.
    product_codes: [dell-pro-max-mc16250-laptop, dell-pro-precision-pw516261-laptop]
    # PW516261 (Dell Pro Precision 5 Series 16) added 2026-10-15 at the user's request. Dell is
    # rebranding Pro Max to Pro Precision; third-party lists call it MC16260 (not confirmed by Dell).
    next_generation_probe: dell-pro-max-mc16260-laptop
    auto_add_new: false
  - id: dell-pro-max-16-plus
    description: Dell Pro Max 16 Plus (user wrote "Pro Max Plus 16"), 64 GB RAM, every discrete GPU option.
    product_codes: [dell-pro-max-mb16250-laptop]
    next_generation_probe: dell-pro-max-mb16260-laptop
    auto_add_new: false

# How a Machine is placed in a Hardware tier. Mirrors the Runbook.
tier_rules:
  mac: "Unified memory. Up to 36 GB: weights <= 60% of memory (leaves room for macOS, the GPU memory cap and 64k context). 48 GB and up: weights + KV cache at 64k <= memory - 16 GB (needs iogpu.wired_limit_mb raised when above the default GPU cap)."
  windows_dgpu: "If a dense model fits the GPU: weights <= VRAM - 3 GB. Otherwise MoE models are split GPU/CPU and the tier is set by system RAM."
  windows_igpu: "Shared memory, ~100-140 GB/s. Weights <= RAM - 10 GB; only MoE models reach 15 tok/s."
  grouping: "Macs by memory, Windows by GPU/RAM class. A Machine with bandwidth far below the rest of its tier (base M1, ~67 GB/s vs 100+) gets its own tier."

tiers:
  "Mac M1 8 GB": {weights_max_gb: 4.8, bandwidth_gbs: [67, 67]}
  "Mac 8 GB": {weights_max_gb: 4.8,  bandwidth_gbs: [100, 100]}
  "Mac M1 16 GB": {weights_max_gb: 9.6, bandwidth_gbs: [67, 67]}
  "Mac 16-24 GB": {weights_max_gb: 9.6,  bandwidth_gbs: [100, 307]}
  "Mac 32-36 GB": {weights_max_gb: 19.2, bandwidth_gbs: [120, 460]}
  "Mac 48-96 GB": {weights_plus_kv_max_gb: 32, bandwidth_gbs: [273, 614]}
  "Mac 128 GB": {weights_plus_kv_max_gb: 112, bandwidth_gbs: [400, 614]}
  "Latitude 7350": {weights_max_gb: 6,  bandwidth_gbs: [102, 102]}
  "Windows 32 GB": {weights_max_gb: 22, bandwidth_gbs: [90, 137]}
  "Pro Max 16 Plus, 8-16 GB GPU": {weights_max_gb: 54, bandwidth_gbs: [102, 115], gpu_bandwidth_gbs: [384, 896]}
  "Pro Max 16 Plus, 24 GB GPU": {weights_max_gb: 54, bandwidth_gbs: [102, 115], gpu_bandwidth_gbs: [896, 896]}

