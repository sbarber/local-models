<style>
  html { font-size: 15px; }
  body { max-width: 72rem; padding: 2rem 2.5rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.5; color: #1f2328; }
  h1 { font-size: 1.9rem; margin-bottom: .3rem; }
  h2 { font-size: 1.45rem; margin-top: 2.6rem; padding-bottom: .3rem; border-bottom: 1px solid #d0d7de; }
  h3 { font-size: 1.12rem; margin-top: 2rem; }
  table { border-collapse: collapse; margin: .8rem 0 1.2rem; font-size: .93rem; width: auto; }

  th { background: #f6f8fa; font-weight: 600; }
  tbody tr:nth-child(even) { background: #fafbfc; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; background: #eff1f3; padding: .1em .35em; border-radius: 4px; }
  pre { background: #f6f8fa; padding: .8rem 1rem; border-radius: 6px; overflow-x: auto; }

  ol.refs li { margin: .25rem 0; scroll-margin-top: 1rem; }
